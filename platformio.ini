; Photon minimal feeder test-bed firmware
; Section 7 - stripped firmware base
;
; Purpose:
; - Keep only the STM32 / Arduino / PlatformIO build chain.
; - No Photon protocol.
; - No feeder network layer.
; - No closed-loop feed logic.
; - Build firmware.bin for STM32CubeProgrammer UART loading.

[platformio]
default_envs = photon-serial

[env]
platform = ststm32
framework = arduino
board = nucleo_f031k6
monitor_speed = 57600
build_flags =
    -Os
    -ggdb2
    -D VERSION_STRING=\"${sysenv.VERSION_STRING}\"

[env:stm32f031k6t6]
board_build.mcu = stm32f031k6t6
build_flags =
    ${env.build_flags}

[env:photon-serial]
extends = env:stm32f031k6t6
upload_protocol = serial
upload_speed = 9600
