; Photon feeder - STM32F031C6Tx bare-metal test
; Section 7.3
;
; No Arduino framework.
; No HAL.
; No LL.
; Direct register access only.
;
; Build output:
;   .pio/build/baremetal/firmware.bin
;
; Load with STM32CubeProgrammer UART at address 0x08000000.

[platformio]
default_envs = baremetal

[env:baremetal]
platform = ststm32
board = nucleo_f031k6

; Actual feeder MCU target.
board_build.mcu = stm32f031c6t6
board_build.f_cpu = 48000000L
board_build.ldscript = linker/stm32f031c6tx.ld

build_flags =
    -std=c11
    -Wall
    -Wextra
    -Os
    -ffunction-sections
    -fdata-sections
    -nostartfiles
    -DHSE_VALUE=8000000U
    -DF_CPU=48000000U
    -Wl,--gc-sections
    -Wl,-Map,firmware.map

upload_protocol = custom
